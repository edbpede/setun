# Configuration file for `prek`, a git hook framework written in Rust.
# See https://prek.j178.dev for more information.
#:schema https://www.schemastore.org/prek.json

# Generated and build output: Paraglide compiles messages/ into src/lib/paraglide,
# SvelteKit generates .svelte-kit, adapter-node writes build/. None are hand-edited,
# and all are gitignored — formatting hooks must not touch them.
exclude = '^(src/lib/paraglide/|\.svelte-kit/|build/|test-results/|playwright-report/|bun\.lock$)'

[[repos]]
repo = "builtin"
hooks = [
  { id = "trailing-whitespace" },
  { id = "end-of-file-fixer" },
  { id = "mixed-line-ending", args = ["--fix=lf"] },
  { id = "check-merge-conflict" },
  { id = "check-case-conflict" },
  { id = "check-added-large-files", args = ["--maxkb=500"] },
  { id = "detect-private-key" },
  # tsconfig.json carries comments (JSONC), which strict JSON parsing rejects.
  { id = "check-json", exclude = '^tsconfig\.json$' },
  { id = "check-toml" },
  { id = "check-yaml" },
  { id = "no-commit-to-branch", args = ["--branch", "main"] },
]

# Conventional Commits
[[repos]]
repo = "https://github.com/compilerla/conventional-pre-commit"
rev = "v4.4.0"
hooks = [
  { id = "conventional-pre-commit", stages = ["commit-msg"] },
]

# Secret / credential leak guard — fixtures and dotfiles must never carry tokens.
[[repos]]
repo = "https://github.com/gitleaks/gitleaks"
rev = "v8.30.1"
hooks = [
  { id = "gitleaks" },
]

[[repos]]
repo = "local"
hooks = [
  # `--no-errors-on-unmatched`: Biome exits non-zero when every staged file lies
  # outside its configured paths, which is the normal case for a commit touching
  # only messages/ or project.inlang/.
  { id = "biome", name = "Format and lint with Biome", entry = "bunx biome check --write --no-errors-on-unmatched", language = "system", types_or = ["javascript", "ts", "svelte", "json", "css"] },
  { id = "svelte-check", name = "TypeScript and Svelte type check", entry = "bun run check", language = "system", pass_filenames = false, stages = ["pre-push"] },
  { id = "tests", name = "Run test suite", entry = "bun test", language = "system", pass_filenames = false, stages = ["pre-push"] },
]

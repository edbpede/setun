<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Setun artifact runner</title>
    <!--
      The separate-origin artifact host (PRD §6, §14). Caddy serves these files
      statically on their own hostname; the application never serves this origin.

      This page is itself loaded inside an iframe sandboxed without
      `allow-same-origin`, so its document has an opaque origin: it cannot read
      application cookies, storage or DOM, and neither can the artifact it runs.
      Generated code goes one frame further down still, so it cannot reach the
      bridge that talks to the application either.
    -->
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #fff;
      }
      #stage {
        display: block;
        width: 100%;
        height: 100%;
        border: 0;
      }
    </style>
  </head>
  <body>
    <!--
      The artifact's own document. Sandboxed again on its own account: an
      iframe's sandbox flags are the intersection of its own and its parent's,
      so this is belt and braces rather than the only restriction.
    -->
    <iframe
      id="stage"
      sandbox="allow-scripts"
      referrerpolicy="no-referrer"
      allow=""
      title="Artifact"
    ></iframe>
    <script type="module" src="/src/runner.ts"></script>
  </body>
</html>

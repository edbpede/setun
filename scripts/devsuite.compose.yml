# CPA and Caddy for local development, driven by scripts/devsuite.
#
# Not an override of docker-compose.yml, and deliberately so. There, CPA sits on
# an `internal` network with no published port — it is reachable only by the app
# container, and that unreachability is a stated property of the deployment
# (PRD §6, §9). Locally the application runs on the *host*, so it must reach the
# gateway over a published port; the two topologies genuinely differ, and an
# override that quietly punched a hole in the production file would be the worse
# way to say so.
#
# What is shared is what matters: the same pinned image, the same unmodified
# upstream, the same operator-owned cpa/config.yaml. The image tag here and the
# one in docker-compose.yml must be bumped together.
#
# The project name comes from `--project-name`, so each instance gets its own
# container and its own auth volume, and `destroy` can take both away.

services:
  cpa:
    image: eceasy/cli-proxy-api:v7.2.140
    restart: unless-stopped
    # Loopback only. A development gateway that answered on every interface
    # would be a provider credential listening on the office wifi.
    ports:
      - "127.0.0.1:${SETUN_CPA_PORT:-8317}:8317"
    volumes:
      - ./cpa/config.yaml:/CLIProxyAPI/config.yaml
      - cpa-auth:/root/.cli-proxy-api

  # The deployment's proxy tier, on the deployment's image, reading the
  # repository's own Caddyfile — not a copy of it. What differs between here and
  # docker-compose.yml is the two hostname variables and the upstream, and that
  # is the whole point: the static server, the response headers, the origin
  # shape and the proxy hop are then the ones a deployment actually has.
  #
  # The hostnames the suite supplies carry an explicit `http://` scheme, which
  # is what tells Caddy to serve plain HTTP on that port and skip ACME. A
  # deployment passes bare hostnames and gets automatic HTTPS instead; the file
  # does not know the difference. `*.localhost` resolves to loopback without an
  # /etc/hosts entry, so two real origins cost nothing to set up.
  caddy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    # Same number inside and out: the port is part of the origin, and an origin
    # that differed between Caddy's view and the browser's would break both the
    # CSP sources and adapter-node's CSRF check.
    ports:
      - "127.0.0.1:${SETUN_CADDY_PORT:-8080}:${SETUN_CADDY_PORT:-8080}"
    environment:
      SETUN_APP_HOSTNAME: ${SETUN_APP_HOSTNAME}
      SETUN_SANDBOX_HOSTNAME: ${SETUN_SANDBOX_HOSTNAME}
      SETUN_APP_UPSTREAM: ${SETUN_APP_UPSTREAM}
      SETUN_ACME_EMAIL: ""
    # The application runs on the host here rather than as a container on this
    # network, so Caddy needs a route back out to it.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # The same directory `bun run build:sandbox` writes and the deployment
      # mounts, served by the same file_server. No Vite in the path at all.
      - ./build-sandbox:/srv/sandbox:ro

volumes:
  cpa-auth:
